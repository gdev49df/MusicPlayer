<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src media: data: blob: https://*.mzstatic.com https://*.dzcdn.net; media-src media:; connect-src media: https://lrclib.net">
<title>Куплет</title>
<style>/*CSS*/</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><b>Куплет</b></div>
  <div class="nav">
    <button class="icon" id="back" data-icon="back" title="Назад (Alt+←)" aria-label="Назад"></button>
    <button class="icon" id="forward" data-icon="forward" title="Вперёд (Alt+→)" aria-label="Вперёд"></button>
  </div>
  <label class="search">
    <span data-icon="search"></span>
    <input id="search" type="search" placeholder="Что включить? Название, артист, альбом" autocomplete="off" spellcheck="false" aria-label="Поиск">
  </label>
  <button class="pill" id="updatePill" hidden></button>
</header>

<div id="shell">
  <aside id="side">
    <nav id="menu"></nav>
    <div class="listhead">
      <span>Плейлисты</span>
      <button class="icon" id="newList" data-icon="plus" title="Новый плейлист" aria-label="Новый плейлист"></button>
    </div>
    <div id="lists"></div>
    <div class="sidefoot">
      <div id="scan" hidden><span></span><progress max="1"></progress></div>
      <button class="wide" id="addMusic"><span data-icon="folder"></span>Добавить музыку</button>
      <p>Разработано GwebStudio</p>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<footer id="bar">
  <div class="now">
    <button id="nowCover" class="cover" title="Открыть текст песни" aria-label="Открыть текст песни"></button>
    <div class="names"><button class="text" id="nowTitle"></button><button class="text sub" id="nowArtist"></button></div>
    <button class="icon heart" id="nowLike" data-icon="heart" title="В любимое" aria-label="В любимое" hidden></button>
  </div>
  <div class="center">
    <div class="controls">
      <button class="icon" id="shuffle" data-icon="shuffle" title="Перемешать (S)" aria-label="Перемешать"></button>
      <button class="icon" id="prev" data-icon="prev" title="Предыдущий (Ctrl+←)" aria-label="Предыдущий"></button>
      <button class="play" id="play" data-icon="play" title="Играть или пауза (пробел)" aria-label="Играть"></button>
      <button class="icon" id="next" data-icon="next" title="Следующий (Ctrl+→)" aria-label="Следующий"></button>
      <button class="icon" id="repeat" data-icon="repeat" title="Повтор (R)" aria-label="Повтор"></button>
    </div>
    <div class="seek"><span id="time">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="length">0:00</span></div>
  </div>
  <div class="extra">
    <button class="icon" id="lyricsBtn" data-icon="lyrics" title="Текст песни (L)" aria-label="Текст песни"></button>
    <button class="icon" id="queueBtn" data-icon="queue" title="Очередь (Q)" aria-label="Очередь"></button>
    <button class="icon" id="mute" data-icon="volume" title="Выключить звук (M)" aria-label="Звук"></button>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="Громкость">
  </div>
</footer>

<section id="stage" hidden tabindex="-1" aria-label="Текст песни">
  <div class="backdrop"></div>
  <div class="stagetop">
    <div class="tools" id="stageTools"></div>
    <button class="icon" id="stageClose" data-icon="close" title="Закрыть (Esc)" aria-label="Закрыть"></button>
  </div>
  <div class="stagebody">
    <div class="stageart"><div class="cover" id="stageCover"></div><h2 id="stageTitle"></h2><p id="stageArtist"></p></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
</section>

<div id="dropzone" hidden><div><span data-icon="folder"></span><b>Отпустите, чтобы добавить в библиотеку</b></div></div>
<div id="toast" role="status" hidden></div>
<audio id="audio" preload="auto"></audio>
<script>/*JS*/</script>
</body>
</html>
